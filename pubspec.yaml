name: nido_bank
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  device_preview: ^1.3.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/nido-icons/nido-icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "lib/assets/nido-icons/nido-icon-background-1024.png"
  adaptive_icon_foreground: "lib/assets/nido-icons/nido-icon-foreground-1024.png"
